<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/x-icon"
      href="images/business-to-do-list-flat-icon-modern-style-free-vector.jpg"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Browser To-Do List 2</title>
  </head>
  <body>
    <div class="app-body">
      <h1>To-Do List</h1>
      <form class="task-input-area">
        <input type="text" placeholder="New Task" class="task-input" />
        <button type="button" class="add-tsk-btn">
          <img src="images/add-button.png" alt="Add Task" />
        </button>
      </form>
      <div class="list-items-body">
        <ul class="to-do-items"></ul>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
